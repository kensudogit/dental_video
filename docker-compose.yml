# Local full stack: PostgreSQL + MinIO + Gateway + 6 SaaS microservices + Next.js
# Usage: docker compose up --build
# Web http://localhost:3000  Gateway http://localhost:8080/graphql

x-saas-env: &saas-env
  DATABASE_URL: postgres://dental:dental@db:5432/dental_video?sslmode=disable
  JWT_SECRET: dev-docker-change-me

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: dental
      POSTGRES_DB: dental_video
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dental_video"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minio minio12345;
      mc mb -p local/dental-video || true;
      exit 0;
      "

  saas-dx:
    build:
      context: ./backend
      dockerfile: Dockerfile.micro
      args:
        SERVICE: saas-dx
    environment:
      <<: *saas-env
      PORT: "8081"
    depends_on:
      db:
        condition: service_healthy

  saas-crm:
    build:
      context: ./backend
      dockerfile: Dockerfile.micro
      args:
        SERVICE: saas-crm
    environment:
      <<: *saas-env
      PORT: "8082"
    depends_on:
      db:
        condition: service_healthy

  saas-attendance:
    build:
      context: ./backend
      dockerfile: Dockerfile.micro
      args:
        SERVICE: saas-attendance
    environment:
      <<: *saas-env
      PORT: "8083"
    depends_on:
      db:
        condition: service_healthy

  saas-contract:
    build:
      context: ./backend
      dockerfile: Dockerfile.micro
      args:
        SERVICE: saas-contract
    environment:
      <<: *saas-env
      PORT: "8084"
    depends_on:
      db:
        condition: service_healthy

  saas-chat:
    build:
      context: ./backend
      dockerfile: Dockerfile.micro
      args:
        SERVICE: saas-chat
    environment:
      <<: *saas-env
      PORT: "8085"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy

  saas-rag:
    build:
      context: ./backend
      dockerfile: Dockerfile.micro
      args:
        SERVICE: saas-rag
    environment:
      <<: *saas-env
      PORT: "8086"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://dental:dental@db:5432/dental_video?sslmode=disable
      JWT_SECRET: dev-docker-change-me
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: auto
      S3_BUCKET: dental-video
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_FORCE_PATH_STYLE: "true"
      S3_PUBLIC_BASE_URL: http://localhost:9000/dental-video
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      APP_PUBLIC_URL: http://localhost:3000
      SAAS_DX_URL: http://saas-dx:8081
      SAAS_CRM_URL: http://saas-crm:8082
      SAAS_ATTENDANCE_URL: http://saas-attendance:8083
      SAAS_CONTRACT_URL: http://saas-contract:8084
      SAAS_CHAT_URL: http://saas-chat:8085
      SAAS_RAG_URL: http://saas-rag:8086
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      saas-dx:
        condition: service_started
      saas-crm:
        condition: service_started
      saas-attendance:
        condition: service_started
      saas-contract:
        condition: service_started
      saas-chat:
        condition: service_started
      saas-rag:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080/graphql
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
